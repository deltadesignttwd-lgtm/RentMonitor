name: Weekly OpenRent SE13 5HU Scrape

# Step 1: every Monday 11:00 UTC, hit the OpenRent SE13 5HU search page
# (BST is UTC+1, so this is 12:00 UK time during summer / 11:00 during winter).
# Step 2: extract rent, address, type, furnishing for each listing.
# Step 3: send the results to Telegram. No Google Sheets involved.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OpenRent scraper
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scrape_openrent.py

name: Weekly OpenRent SE13 5HU Scrape

# Step 1: hit the OpenRent SE13 5HU search page.
# Step 2: extract rent, address, type, furnishing for each listing.
# Step 3: send the results to Telegram. No Google Sheets involved.
#
# NOTE: openrent.co.uk returns 405 to requests from GitHub-hosted runners
# (their datacenter IP ranges are blocked), confirmed across several runs
# with correct URL encoding and full browser headers. So there's no
# `schedule:` trigger here anymore — the actual weekly run happens via cron
# on a local machine (see README/chat instructions). This workflow is kept
# as workflow_dispatch only, for manual one-off runs/debugging.
on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OpenRent scraper
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scrape_openrent.py
